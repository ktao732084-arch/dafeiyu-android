# Include inside the existing HTTPS server. Certificate renewal remains unchanged.
location = /dafeiyu-feedback { return 308 /dafeiyu-feedback/; }
location ^~ /dafeiyu-feedback/ {
    client_max_body_size 5m;
    client_body_timeout 15s;
    limit_req zone=dafeiyu_feedback burst=12 nodelay;
    limit_req_status 429;
    limit_conn dafeiyu_feedback_connections 8;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_hide_header Server;
    access_log off;
}
