# Include inside the existing public-IP HTTPS server block.
# /srv/dafeiyu-updates contains only public update artifacts.
location ^~ /dafeiyu-updates/ {
    root /srv;
    autoindex off;
    auth_basic off;
    limit_except GET { deny all; }

    location = /dafeiyu-updates/stable.json {
        default_type application/json;
        add_header Cache-Control "no-cache, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /dafeiyu-updates/health.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ "^/dafeiyu-updates/releases/[0-9]+-[a-f0-9]{64}\.apk$" {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Reject directory listings, temporary uploads and all unlisted paths.
    location ~ . { return 404; }
}
